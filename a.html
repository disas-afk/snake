<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Blaster</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  canvas {
    border: 2px solid #1a1a3e;
    border-radius: 8px;
    box-shadow: 0 0 40px rgba(80, 120, 255, 0.3);
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = 480;
canvas.height = 720;

// --- Game State ---
let state = 'menu'; // menu, playing, gameover
let score = 0;
let highScore = parseInt(localStorage.getItem('spaceBlasterHigh')) || 0;
let lives = 3;
let level = 1;
let enemySpawnTimer = 0;
let enemySpawnRate = 90;
let shakeTimer = 0;
let shakeIntensity = 0;
let frameCount = 0;

// --- Input ---
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'Space' && state !== 'playing') startGame();
});
window.addEventListener('keyup', e => keys[e.code] = false);

// --- Stars ---
const stars = Array.from({length: 120}, () => ({
  x: Math.random() * canvas.width,
  y: Math.random() * canvas.height,
  size: Math.random() * 2 + 0.5,
  speed: Math.random() * 2 + 0.5,
  brightness: Math.random()
}));

// --- Player ---
const player = {
  x: canvas.width / 2, y: canvas.height - 80,
  w: 36, h: 40, speed: 5, shootCooldown: 0, invincible: 0
};

// --- Arrays ---
let bullets = [];
let enemies = [];
let particles = [];
let powerups = [];
let enemyBullets = [];

function startGame() {
  state = 'playing';
  score = 0; lives = 3; level = 1;
  enemySpawnRate = 90; enemySpawnTimer = 0;
  player.x = canvas.width / 2; player.y = canvas.height - 80;
  player.invincible = 0; player.shootCooldown = 0;
  bullets = []; enemies = []; particles = [];
  powerups = []; enemyBullets = [];
}

// --- Spawn Helpers ---
function spawnEnemy() {
  const types = ['basic', 'fast', 'tank', 'shooter'];
  const weights = [50, 20 + level * 3, 10 + level * 2, 5 + level * 4];
  const total = weights.reduce((a, b) => a + b);
  let r = Math.random() * total, type = types[0];
  for (let i = 0; i < weights.length; i++) {
    r -= weights[i];
    if (r <= 0) { type = types[i]; break; }
  }
  const e = {
    x: Math.random() * (canvas.width - 40) + 20,
    y: -30, type, shootTimer: Math.random() * 120
  };
  if (type === 'basic')  Object.assign(e, { w:28, h:28, hp:1, speed:1.5+level*0.15, color:'#ff4466', pts:10 });
  if (type === 'fast')   Object.assign(e, { w:22, h:22, hp:1, speed:3+level*0.2, color:'#ffaa00', pts:15 });
  if (type === 'tank')   Object.assign(e, { w:36, h:36, hp:3, speed:0.8+level*0.1, color:'#aa44ff', pts:30 });
  if (type === 'shooter')Object.assign(e, { w:30, h:30, hp:2, speed:1+level*0.1, color:'#44ffaa', pts:25 });
  enemies.push(e);
}

function spawnParticles(x, y, color, count = 12) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 4 + 1;
    particles.push({
      x, y, vx: Math.cos(angle)*speed, vy: Math.sin(angle)*speed,
      life: 1, decay: Math.random()*0.03+0.02, size: Math.random()*3+1, color
    });
  }
}

// --- Update ---
function update() {
  frameCount++;

  // Stars
  stars.forEach(s => {
    s.y += s.speed;
    if (s.y > canvas.height) { s.y = 0; s.x = Math.random() * canvas.width; }
  });

  if (state !== 'playing') return;

  // Level up
  const newLevel = Math.floor(score / 150) + 1;
  if (newLevel > level) {
    level = newLevel;
    enemySpawnRate = Math.max(25, 90 - level * 7);
  }

  // Player movement
  if (keys['ArrowLeft']  || keys['KeyA']) player.x -= player.speed;
  if (keys['ArrowRight'] || keys['KeyD']) player.x += player.speed;
  if (keys['ArrowUp']    || keys['KeyW']) player.y -= player.speed;
  if (keys['ArrowDown']  || keys['KeyS']) player.y += player.speed;
  player.x = Math.max(player.w/2, Math.min(canvas.width - player.w/2, player.x));
  player.y = Math.max(player.h/2, Math.min(canvas.height - player.h/2, player.y));

  // Shooting
  if (player.shootCooldown > 0) player.shootCooldown--;
  if (keys['Space'] && player.shootCooldown <= 0) {
    bullets.push({ x: player.x - 8, y: player.y - 20, w: 4, h: 12, speed: 8 });
    bullets.push({ x: player.x + 8, y: player.y - 20, w: 4, h: 12, speed: 8 });
    player.shootCooldown = 10;
  }
  if (player.invincible > 0) player.invincible--;

  // Bullets
  bullets.forEach(b => b.y -= b.speed);
  bullets = bullets.filter(b => b.y > -20);

  // Enemy bullets
  enemyBullets.forEach(b => { b.x += b.vx; b.y += b.vy; });
  enemyBullets = enemyBullets.filter(b => b.y < canvas.height + 20 && b.y > -20 && b.x > -20 && b.x < canvas.width + 20);

  // Enemies
  enemySpawnTimer++;
  if (enemySpawnTimer >= enemySpawnRate) { spawnEnemy(); enemySpawnTimer = 0; }
  enemies.forEach(e => {
    e.y += e.speed;
    if (e.type === 'fast') e.x += Math.sin(frameCount * 0.05 + e.y * 0.02) * 2;
    if (e.type === 'shooter') {
      e.shootTimer--;
      if (e.shootTimer <= 0 && e.y > 30 && e.y < canvas.height * 0.6) {
        const angle = Math.atan2(player.y - e.y, player.x - e.x);
        enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(angle)*3, vy: Math.sin(angle)*3, r: 4 });
        e.shootTimer = 80 + Math.random() * 40;
      }
    }
  });
  enemies = enemies.filter(e => e.y < canvas.height + 50);

  // Bullet-Enemy collision
  bullets.forEach(b => {
    enemies.forEach(e => {
      if (Math.abs(b.x - e.x) < (b.w/2 + e.w/2) && Math.abs(b.y - e.y) < (b.h/2 + e.h/2)) {
        b.hit = true; e.hp--;
        spawnParticles(b.x, b.y, '#fff', 4);
        if (e.hp <= 0) {
          e.dead = true; score += e.pts;
          spawnParticles(e.x, e.y, e.color, 18);
          shakeTimer = 6; shakeIntensity = 3;
        }
      }
    });
  });
  bullets = bullets.filter(b => !b.hit);
  enemies = enemies.filter(e => !e.dead);

  // Enemy-Player collision
  if (player.invincible <= 0) {
    enemies.forEach(e => {
      if (Math.abs(player.x - e.x) < (player.w/2 + e.w/2 - 6) &&
          Math.abs(player.y - e.y) < (player.h/2 + e.h/2 - 6)) {
        e.dead = true; lives--; player.invincible = 90;
        spawnParticles(player.x, player.y, '#4488ff', 25);
        shakeTimer = 12; shakeIntensity = 6;
        if (lives <= 0) {
          state = 'gameover';
          if (score > highScore) { highScore = score; localStorage.setItem('spaceBlasterHigh', highScore); }
        }
      }
    });
    // Enemy bullet-Player
    enemyBullets.forEach(b => {
      if (Math.abs(player.x - b.x) < (player.w/2 + b.r) && Math.abs(player.y - b.y) < (player.h/2 + b.r)) {
        b.hit = true; lives--; player.invincible = 90;
        spawnParticles(player.x, player.y, '#ff4444', 15);
        shakeTimer = 10; shakeIntensity = 5;
        if (lives <= 0) {
          state = 'gameover';
          if (score > highScore) { highScore = score; localStorage.setItem('spaceBlasterHigh', highScore); }
        }
      }
    });
    enemyBullets = enemyBullets.filter(b => !b.hit);
    enemies = enemies.filter(e => !e.dead);
  }

  // Particles
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= p.decay; p.vx *= 0.98; p.vy *= 0.98; });
  particles = particles.filter(p => p.life > 0);

  if (shakeTimer > 0) shakeTimer--;
}

// --- Draw ---
function drawShip(x, y, w, h, inv) {
  if (inv && Math.floor(frameCount / 4) % 2) return;
  ctx.save(); ctx.translate(x, y);
  // Glow
  ctx.shadowColor = '#4488ff'; ctx.shadowBlur = 15;
  // Body
  ctx.fillStyle = '#4488ff';
  ctx.beginPath();
  ctx.moveTo(0, -h/2);
  ctx.lineTo(-w/2, h/2);
  ctx.lineTo(-w/4, h/3);
  ctx.lineTo(w/4, h/3);
  ctx.lineTo(w/2, h/2);
  ctx.closePath(); ctx.fill();
  // Cockpit
  ctx.fillStyle = '#88ccff';
  ctx.beginPath();
  ctx.moveTo(0, -h/3);
  ctx.lineTo(-6, h/6);
  ctx.lineTo(6, h/6);
  ctx.closePath(); ctx.fill();
  // Engine flame
  ctx.shadowColor = '#ff8800'; ctx.shadowBlur = 10;
  ctx.fillStyle = frameCount % 4 < 2 ? '#ff6600' : '#ffaa00';
  ctx.beginPath();
  ctx.moveTo(-6, h/3);
  ctx.lineTo(0, h/2 + 8 + Math.random()*6);
  ctx.lineTo(6, h/3);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save(); ctx.translate(e.x, e.y);
  ctx.shadowColor = e.color; ctx.shadowBlur = 10;
  ctx.fillStyle = e.color;
  if (e.type === 'basic') {
    ctx.beginPath();
    ctx.moveTo(0, -e.h/2); ctx.lineTo(e.w/2, e.h/4);
    ctx.lineTo(0, e.h/2); ctx.lineTo(-e.w/2, e.h/4);
    ctx.closePath(); ctx.fill();
  } else if (e.type === 'fast') {
    ctx.beginPath();
    ctx.moveTo(0, e.h/2); ctx.lineTo(-e.w/2, -e.h/2); ctx.lineTo(e.w/2, -e.h/2);
    ctx.closePath(); ctx.fill();
  } else if (e.type === 'tank') {
    ctx.fillRect(-e.w/2, -e.h/2, e.w, e.h);
    ctx.fillStyle = '#fff3'; ctx.fillRect(-e.w/4, -e.h/4, e.w/2, e.h/2);
  } else if (e.type === 'shooter') {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (Math.PI * 2 / 6) * i - Math.PI/2;
      const r = e.w / 2;
      ctx[i===0?'moveTo':'lineTo'](Math.cos(a)*r, Math.sin(a)*r);
    }
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function draw() {
  ctx.save();
  if (shakeTimer > 0) {
    ctx.translate(
      (Math.random()-0.5) * shakeIntensity,
      (Math.random()-0.5) * shakeIntensity
    );
  }

  // Background
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#05051a');
  grad.addColorStop(1, '#0a0a2e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Stars
  stars.forEach(s => {
    const b = 0.4 + Math.sin(frameCount * 0.02 + s.brightness * 10) * 0.3;
    ctx.fillStyle = `rgba(200,220,255,${b})`;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  });

  if (state === 'menu') {
    ctx.textAlign = 'center';
    ctx.shadowColor = '#4488ff'; ctx.shadowBlur = 30;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px Segoe UI';
    ctx.fillText('SPACE BLASTER', canvas.width/2, canvas.height/2 - 80);
    ctx.shadowBlur = 0;
    ctx.font = '18px Segoe UI';
    ctx.fillStyle = '#88aaff';
    ctx.fillText('Arrow Keys / WASD to move', canvas.width/2, canvas.height/2);
    ctx.fillText('SPACE to shoot', canvas.width/2, canvas.height/2 + 30);
    ctx.fillStyle = '#fff';
    ctx.font = '22px Segoe UI';
    const pulse = 0.6 + Math.sin(frameCount * 0.06) * 0.4;
    ctx.globalAlpha = pulse;
    ctx.fillText('Press SPACE to Start', canvas.width/2, canvas.height/2 + 100);
    ctx.globalAlpha = 1;
    if (highScore > 0) {
      ctx.font = '16px Segoe UI'; ctx.fillStyle = '#ffaa44';
      ctx.fillText(`High Score: ${highScore}`, canvas.width/2, canvas.height/2 + 150);
    }
    ctx.restore(); return;
  }

  // Bullets
  ctx.shadowColor = '#88ccff'; ctx.shadowBlur = 8;
  ctx.fillStyle = '#88ddff';
  bullets.forEach(b => ctx.fillRect(b.x - b.w/2, b.y - b.h/2, b.w, b.h));

  // Enemy bullets
  ctx.shadowColor = '#ff4444'; ctx.shadowBlur = 8;
  ctx.fillStyle = '#ff6666';
  enemyBullets.forEach(b => {
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
  });
  ctx.shadowBlur = 0;

  // Enemies
  enemies.forEach(drawEnemy);

  // Player
  if (state === 'playing' || state === 'gameover') {
    drawShip(player.x, player.y, player.w, player.h, player.invincible > 0);
  }

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
  });
  ctx.globalAlpha = 1;

  // HUD
  ctx.textAlign = 'left'; ctx.font = 'bold 20px Segoe UI';
  ctx.fillStyle = '#fff'; ctx.fillText(`Score: ${score}`, 15, 32);
  ctx.fillStyle = '#ffaa44'; ctx.font = '14px Segoe UI';
  ctx.fillText(`Level ${level}`, 15, 52);
  ctx.textAlign = 'right';
  ctx.fillStyle = '#ff4466'; ctx.font = '20px Segoe UI';
  let heartsStr = '';
  for (let i = 0; i < lives; i++) heartsStr += '❤️ ';
  ctx.fillText(heartsStr, canvas.width - 10, 32);

  // Game Over
  if (state === 'gameover') {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ff4444'; ctx.shadowBlur = 20;
    ctx.fillStyle = '#ff4466'; ctx.font = 'bold 44px Segoe UI';
    ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2 - 50);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff'; ctx.font = '24px Segoe UI';
    ctx.fillText(`Score: ${score}`, canvas.width/2, canvas.height/2 + 10);
    if (score >= highScore && score > 0) {
      ctx.fillStyle = '#ffdd44'; ctx.font = '18px Segoe UI';
      ctx.fillText('🏆 New High Score!', canvas.width/2, canvas.height/2 + 45);
    }
    const pulse = 0.5 + Math.sin(frameCount * 0.06) * 0.5;
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#88aaff'; ctx.font = '20px Segoe UI';
    ctx.fillText('Press SPACE to Retry', canvas.width/2, canvas.height/2 + 95);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

// --- Loop ---
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
